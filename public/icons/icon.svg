<!-- OU Study Japan App Icon — 512x512 SVG -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0f11"/>
      <stop offset="100%" style="stop-color:#1a0808"/>
    </linearGradient>
    <linearGradient id="crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#CC2124"/>
      <stop offset="100%" style="stop-color:#841617"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Torii gate shape -->
  <rect x="108" y="180" width="296" height="28" rx="14" fill="url(#crimson)"/>
  <rect x="148" y="148" width="216" height="24" rx="12" fill="url(#crimson)"/>
  <rect x="148" y="208" width="28" height="164" rx="14" fill="url(#crimson)"/>
  <rect x="336" y="208" width="28" height="164" rx="14" fill="url(#crimson)"/>
  <!-- OU text -->
  <text x="256" y="430" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="-2">OU</text>
  <!-- Cherry blossom accent -->
  <circle cx="256" cy="100" r="16" fill="#FFB7C5" opacity="0.8"/>
  <circle cx="226" cy="112" r="10" fill="#FFB7C5" opacity="0.5"/>
  <circle cx="286" cy="112" r="10" fill="#FFB7C5" opacity="0.5"/>
</svg>
